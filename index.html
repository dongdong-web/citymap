<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>走遍哈尔滨 · Every Street Harbin</title><meta name="description" content="随机探索哈尔滨的每一条街。"><link rel="preconnect" href="https://unpkg.com"><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>
:root{--bg:#0c0f14;--panel:#141922;--line:#283140;--text:#f4f7fb;--muted:#8f9bab;--accent:#ffd24a;--good:#66d19e}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif}main{max-width:980px;margin:auto;padding:22px 16px 70px}.top{display:flex;justify-content:space-between;gap:12px;align-items:end;margin-bottom:18px}.brand{font-size:14px;color:var(--muted);letter-spacing:.15em}.brand b{display:block;color:var(--text);font-size:28px;letter-spacing:.05em;margin-top:4px}.stats{text-align:right;font-size:13px;color:var(--muted)}.stats strong{color:var(--accent);font-size:20px}.card{background:var(--panel);border:1px solid var(--line);border-radius:22px;overflow:hidden}.mission{padding:24px}.eyebrow{color:var(--muted);font-size:13px}.road{font-size:38px;font-weight:800;margin:8px 0 4px}.meta{color:var(--muted);font-size:14px}.bar{height:8px;background:#252d39;border-radius:9px;overflow:hidden;margin:18px 0}.bar i{display:block;height:100%;background:var(--accent);width:0}.actions{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:10px}.btn{border:0;border-radius:14px;padding:14px 12px;font-weight:750;font-size:15px;cursor:pointer;background:#242c38;color:var(--text)}.btn.primary{background:var(--accent);color:#171717}.btn.good{background:#19382c;color:#9ff0c8}.btn:disabled{opacity:.45}.mapwrap{height:440px;border-top:1px solid var(--line)}#map{height:100%;width:100%}.section{margin-top:18px;padding:18px}.section h2{font-size:18px;margin:0 0 14px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.metric{background:#10151c;border:1px solid var(--line);border-radius:15px;padding:14px}.metric b{font-size:20px;display:block}.metric span{font-size:12px;color:var(--muted)}.search{width:100%;background:#0f141b;border:1px solid var(--line);border-radius:13px;padding:12px 14px;color:var(--text);font-size:15px;outline:none}.list{max-height:340px;overflow:auto;margin-top:10px}.item{display:flex;align-items:center;justify-content:space-between;padding:11px 5px;border-bottom:1px solid #202733;font-size:14px}.item small{color:var(--muted)}.done{color:var(--good)}.foot{color:#6f7a89;font-size:12px;line-height:1.7;margin-top:18px}@media(max-width:650px){.road{font-size:32px}.mapwrap{height:360px}.actions{grid-template-columns:1fr 1fr}.actions .primary{grid-column:1/-1}.grid{grid-template-columns:1fr 1fr}.top{align-items:start}.brand b{font-size:24px}}
</style></head><body><main><div class="top"><div class="brand">EVERY STREET HARBIN<b>走遍哈尔滨</b></div><div class="stats">探索进度<br><strong id="pct">0%</strong></div></div>
<div class="card"><div class="mission"><div class="eyebrow">🎲 今晚随机任务</div><div class="road" id="roadName">正在加载路网…</div><div class="meta" id="roadMeta">从哈尔滨城市道路中随机抽取一条未探索街道</div><div class="bar"><i id="progress"></i></div><div class="actions"><button class="btn primary" id="randomBtn">随机一条没走过的街</button><button class="btn" id="navBtn">高德查看</button><button class="btn good" id="doneBtn">✓ 我走过了</button></div></div><div class="mapwrap"><div id="map"></div></div></div>
<div class="card section"><h2>我的哈尔滨</h2><div class="grid"><div class="metric"><b id="doneCount">0</b><span>已探索街道</span></div><div class="metric"><b id="leftCount">—</b><span>等待探索</span></div><div class="metric"><b id="distance">0 km</b><span>已打卡道路总长度*</span></div></div></div>
<div class="card section"><h2>街道图鉴</h2><input id="search" class="search" placeholder="搜索街道，例如：安发街"><div id="list" class="list"></div></div>
<div class="foot">道路数据来自 OpenStreetMap（ODbL），基于 2026-09-28 的 Overpass 导出整理。当前版本按道路名称合并 OSM 路段，并过滤高速、匝道、高架/桥梁名称、施工道路等明显不适合作为步行任务的对象。打卡保存在当前浏览器 localStorage。*总长度是该名称在数据中的道路片段长度之和，不代表你实际步行里程。</div></main>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
const KEY='everyStreetHarbin.v1';let roads=[],current=null,lines=[];const done=new Set(JSON.parse(localStorage.getItem(KEY)||'[]'));const $=id=>document.getElementById(id);
const map=L.map('map',{zoomControl:true}).setView([45.75,126.63],12);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'}).addTo(map);
function km(m){return m<1000?`${m} m`:`${(m/1000).toFixed(1)} km`}
function save(){localStorage.setItem(KEY,JSON.stringify([...done]));renderStats();renderList($('search').value)}
function renderStats(){const n=done.size,total=roads.length,p=total?n/total*100:0;$('pct').textContent=p.toFixed(p<10?1:0)+'%';$('progress').style.width=p+'%';$('doneCount').textContent=n;$('leftCount').textContent=Math.max(0,total-n);let m=roads.filter(r=>done.has(r.id)).reduce((s,r)=>s+r.lengthM,0);$('distance').textContent=(m/1000).toFixed(1)+' km'}
function clearLines(){lines.forEach(x=>map.removeLayer(x));lines=[]}
function showRoad(r){current=r;$('roadName').textContent=r.name;$('roadMeta').textContent=`约 ${km(r.lengthM)} · ${r.segments.length} 个 OSM 路段 · ${done.has(r.id)?'已探索':'未探索'}`;$('doneBtn').textContent=done.has(r.id)?'↩ 取消打卡':'✓ 我走过了';clearLines();let bounds=[];r.segments.forEach(seg=>{let ll=seg.map(p=>[p[1],p[0]]);bounds.push(...ll);lines.push(L.polyline(ll,{weight:6,opacity:.9}).addTo(map))});if(bounds.length)map.fitBounds(bounds,{padding:[28,28],maxZoom:16})}
function randomRoad(){let pool=roads.filter(r=>!done.has(r.id)&&(!current||r.id!==current.id));if(!pool.length)pool=roads;showRoad(pool[Math.floor(Math.random()*pool.length)])}
function renderList(q=''){q=q.trim().toLowerCase();let arr=roads.filter(r=>!q||r.name.toLowerCase().includes(q)).slice(0,120);$('list').innerHTML=arr.map(r=>`<div class="item" data-id="${r.id}"><span class="${done.has(r.id)?'done':''}">${done.has(r.id)?'✓ ':''}${r.name}</span><small>${km(r.lengthM)}</small></div>`).join('')||'<div class="item"><span>没有找到</span></div>';document.querySelectorAll('.item[data-id]').forEach(el=>el.onclick=()=>showRoad(roads.find(r=>r.id===el.dataset.id)))}
$('randomBtn').onclick=randomRoad;$('doneBtn').onclick=()=>{if(!current)return;done.has(current.id)?done.delete(current.id):done.add(current.id);save();showRoad(current)};$('navBtn').onclick=()=>{if(!current)return;window.open('https://uri.amap.com/search?keyword='+encodeURIComponent('哈尔滨 '+current.name)+'&city=哈尔滨&view=map','_blank')};$('search').oninput=e=>renderList(e.target.value);
fetch('./data/harbin-roads.json').then(r=>r.json()).then(d=>{roads=d.roads;renderStats();renderList();randomRoad()}).catch(e=>{$('roadName').textContent='路网加载失败';$('roadMeta').textContent='请通过 GitHub Pages / 本地 HTTP 服务打开，不要直接双击 HTML 文件。';console.error(e)});
</script></body></html>
